<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🀄 중국어 어순 배열 게임</title>
<style>
/* ══════════════════════════════
   리셋 & CSS 변수
══════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pk:#e91e63;--pk-l:#f48fb1;--pk-ll:#fce4ec;--pk-m:#f8bbd0;
  --bl:#1e88e5;--bl-l:#90caf9;--bl-ll:#e3f2fd;--bl-m:#bbdefb;
  --gn:#388e3c;--gn-ll:#e8f5e9;
  --pp:#7b1fa2;
  --gy:#f5f5f5;--gy-d:#bdbdbd;
  --sh:0 8px 32px rgba(233,30,99,.09),0 2px 8px rgba(0,0,0,.06);
  --rd:20px;
}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fce4ec 0%,#f3e5f5 33%,#e8f5e9 66%,#e3f2fd 100%);
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 14px 80px;
}

/* ══════════════════════════════
   헤더
══════════════════════════════ */
.hdr{text-align:center;margin-bottom:18px;}
.hdr h1{
  font-size:1.55rem;font-weight:900;color:var(--pk);
  letter-spacing:-.5px;
  text-shadow:0 2px 12px rgba(233,30,99,.18);
}
.hdr p{font-size:.8rem;color:#bbb;margin-top:4px;}

/* ══════════════════════════════
   진행 바
══════════════════════════════ */
.prog-wrap{width:100%;max-width:560px;margin-bottom:13px;}
.prog-top{
  display:flex;justify-content:space-between;
  font-size:.74rem;color:#bbb;font-weight:700;margin-bottom:5px;
}
.prog-bg{
  background:var(--pk-m);border-radius:50px;
  height:10px;overflow:hidden;
}
.prog-fill{
  background:linear-gradient(90deg,var(--pk-l),var(--pk));
  height:100%;border-radius:50px;
  transition:width .55s cubic-bezier(.4,0,.2,1);
}

/* ══════════════════════════════
   스코어
══════════════════════════════ */
.score-row{
  display:flex;gap:10px;
  width:100%;max-width:560px;
  margin-bottom:14px;
}
.sc-box{
  flex:1;background:#fff;border-radius:15px;
  padding:10px 5px;text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}
.sc-num{font-size:1.35rem;font-weight:900;color:var(--pk);}
.sc-lbl{font-size:.67rem;color:#bbb;font-weight:700;margin-top:1px;}

/* ══════════════════════════════
   메인 게임 카드
══════════════════════════════ */
.card{
  width:100%;max-width:560px;
  background:#fff;border-radius:var(--rd);
  padding:24px 18px 20px;
  box-shadow:var(--sh);
}

/* 문장 번호 뱃지 */
.s-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--pk-l),var(--pk));
  color:#fff;font-size:.69rem;font-weight:800;
  padding:4px 13px;border-radius:50px;
  margin-bottom:13px;letter-spacing:.6px;
}

/* 한국어 뜻 박스 */
.meaning-box{
  background:linear-gradient(135deg,var(--pk-ll),var(--pk-m));
  border-radius:14px;padding:14px 16px;
  margin-bottom:16px;border-left:4px solid var(--pk);
}
.m-lbl{
  font-size:.68rem;color:var(--pk);
  font-weight:800;letter-spacing:.6px;margin-bottom:4px;
}
.m-txt{
  font-size:1.1rem;font-weight:800;
  color:#4a148c;line-height:1.55;
}

/* 힌트 */
.hint-row{
  display:flex;align-items:center;gap:7px;
  margin-bottom:10px;cursor:pointer;user-select:none;
}
.hint-row input{accent-color:var(--pk);width:15px;height:15px;}
.hint-row span{font-size:.78rem;color:#bbb;font-weight:600;}
.hint-txt{
  text-align:center;font-size:.83rem;color:#b0bec5;
  letter-spacing:.7px;min-height:20px;margin-bottom:10px;
  transition:opacity .3s;word-break:keep-all;
  font-style:italic;line-height:1.7;
}

/* 섹션 레이블 */
.sec-lbl{
  font-size:.67rem;color:#ccc;font-weight:800;
  letter-spacing:1.1px;text-transform:uppercase;margin-bottom:7px;
}

/* 단어 카드 풀 */
.word-pool{
  display:flex;flex-wrap:wrap;gap:8px;
  min-height:54px;background:#fafafa;
  border-radius:13px;padding:10px;
  margin-bottom:14px;
  border:2px dashed var(--pk-m);
  align-content:flex-start;
  transition:background .2s;
}
.word-pool:empty::after{
  content:"✅ 모든 카드를 배치했어요!";
  color:#ddd;font-size:.79rem;margin:auto;
}

/* 정답 입력 풀 */
.ans-pool{
  display:flex;flex-wrap:wrap;gap:8px;
  min-height:60px;background:#fff5f8;
  border-radius:13px;padding:10px;
  margin-bottom:16px;
  border:2.5px solid var(--pk-l);
  align-content:flex-start;
  transition:border-color .3s,background .3s;
}
.ans-pool:empty::after{
  content:"👇 카드를 클릭해 여기에 배치하세요";
  color:#f4bbd0;font-size:.79rem;margin:auto;
}
.ans-pool.c-ok{
  border-color:#4caf50;background:#f1f8e9;
  animation:cPulse .5s ease;
}
.ans-pool.c-no{
  border-color:#ef5350;background:#fff5f5;
  animation:wShake .42s ease;
}
@keyframes cPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.018)}
  100%{transform:scale(1)}
}
@keyframes wShake{
  0%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
  100%{transform:translateX(0)}
}

/* ══════════════════════════════
   단어 카드 버튼
══════════════════════════════ */
.wbtn{
  background:linear-gradient(135deg,var(--bl-ll),var(--bl-m));
  color:#1565c0;
  border:2px solid var(--bl-l);
  border-radius:12px;
  padding:9px 15px;
  font-size:.96rem;font-weight:700;
  cursor:pointer;letter-spacing:.2px;
  transition:transform .14s,box-shadow .14s;
  user-select:none;font-family:inherit;line-height:1.3;
}
.wbtn:hover{
  transform:translateY(-3px) scale(1.07);
  box-shadow:0 7px 20px rgba(21,101,192,.22);
}
.wbtn:active{transform:scale(.95);}

/* 정답창 카드 (핑크) */
.wbtn.ans-c{
  background:linear-gradient(135deg,var(--pk-ll),var(--pk-m));
  color:#880e4f;border-color:var(--pk-l);
}
.wbtn.ans-c:hover{
  box-shadow:0 7px 20px rgba(136,14,79,.2);
}

/* ══════════════════════════════
   피드백
══════════════════════════════ */
.feedback{
  text-align:center;font-size:1.02rem;font-weight:800;
  min-height:28px;margin-bottom:12px;letter-spacing:.2px;
  transition:opacity .25s;
}
.feedback.ok{color:#2e7d32;}
.feedback.no{color:#c62828;}

/* ══════════════════════════════
   하단 버튼
══════════════════════════════ */
.btn-row{display:flex;gap:9px;}
.btn-check{
  flex:1;
  background:linear-gradient(135deg,var(--pk),#c2185b);
  color:#fff;border:none;border-radius:14px;
  padding:14px 0;font-size:.97rem;font-weight:800;
  cursor:pointer;letter-spacing:.2px;
  box-shadow:0 4px 16px rgba(233,30,99,.3);
  transition:opacity .2s,transform .14s;font-family:inherit;
}
.btn-check:hover{opacity:.91;transform:translateY(-2px);}
.btn-check:active{transform:scale(.97);}

.btn-reset{
  background:var(--gy);color:var(--gy-d);
  border:2px solid #ebebeb;border-radius:14px;
  padding:14px 15px;font-size:.88rem;font-weight:700;
  cursor:pointer;transition:background .2s;font-family:inherit;
}
.btn-reset:hover{background:#eee;}

.btn-next{
  width:100%;
  background:linear-gradient(135deg,#66bb6a,var(--gn));
  color:#fff;border:none;border-radius:14px;
  padding:14px 0;font-size:.97rem;font-weight:800;
  cursor:pointer;margin-top:9px;
  display:none;
  box-shadow:0 4px 16px rgba(56,142,60,.28);
  transition:opacity .2s,transform .14s;
  font-family:inherit;letter-spacing:.2px;
}
.btn-next.on{display:block;}
.btn-next:hover{opacity:.9;transform:translateY(-2px);}

/* ══════════════════════════════
   완료 화면
══════════════════════════════ */
.done-card{
  width:100%;max-width:560px;
  background:#fff;border-radius:var(--rd);
  padding:38px 22px 32px;
  box-shadow:var(--sh);
  display:none;
  flex-direction:column;align-items:center;
  text-align:center;gap:13px;
}
.done-card.on{display:flex;}
.done-emoji{font-size:4rem;animation:bob .8s infinite alternate;}
@keyframes bob{
  from{transform:translateY(0)}
  to{transform:translateY(-14px)}
}
.done-stars{font-size:1.7rem;letter-spacing:4px;}
.done-title{font-size:1.5rem;font-weight:900;color:var(--pk);}
.done-sub{
  font-size:.9rem;color:#888;line-height:1.85;
  background:var(--pk-ll);
  border-radius:13px;padding:15px 18px;width:100%;
}
.done-sub b{color:var(--pk);}
.done-sub .jiayou{
  display:inline-block;
  font-size:1rem;font-weight:900;color:var(--pk);
  margin-top:6px;
}
.btn-restart{
  width:100%;
  background:linear-gradient(135deg,var(--pk),#c2185b);
  color:#fff;border:none;border-radius:14px;
  padding:14px 0;font-size:.97rem;font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(233,30,99,.28);
  transition:opacity .2s,transform .14s;font-family:inherit;
}
.btn-restart:hover{opacity:.9;transform:translateY(-2px);}

/* ══════════════════════════════
   반응형
══════════════════════════════ */
@media(max-width:400px){
  .hdr h1{font-size:1.28rem;}
  .m-txt{font-size:.98rem;}
  .wbtn{font-size:.86rem;padding:8px 12px;}
  .sc-num{font-size:1.15rem;}
}
</style>
</head>
<body>

<!-- ══ 헤더 ══ -->
<div class="hdr">
  <h1>🀄 중국어 어순 배열 게임</h1>
  <p>카드를 올바른 어순으로 배열해 보세요!</p>
</div>

<!-- ══ 진행 바 ══ -->
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">문장 1 / 4</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bg">
    <div class="prog-fill" id="progFill" style="width:0%"></div>
  </div>
</div>

<!-- ══ 스코어 ══ -->
<div class="score-row">
  <div class="sc-box">
    <div class="sc-num" id="scOK">0</div>
    <div class="sc-lbl">✅ 정답</div>
  </div>
  <div class="sc-box">
    <div class="sc-num" id="scFail">0</div>
    <div class="sc-lbl">❌ 오답</div>
  </div>
  <div class="sc-box">
    <div class="sc-num" id="scStreak">0</div>
    <div class="sc-lbl">🔥 연속</div>
  </div>
</div>

<!-- ══ 게임 카드 ══ -->
<div class="card" id="gameCard">

  <div class="s-badge" id="sBadge">📝 문장 1</div>

  <div class="meaning-box">
    <div class="m-lbl">💬 한국어 뜻</div>
    <div class="m-txt" id="mTxt"></div>
  </div>

  <label class="hint-row">
    <input type="checkbox" id="hintChk" onchange="toggleHint()"/>
    <span>🔍 전체 병음 힌트 보기</span>
  </label>
  <div class="hint-txt" id="hintTxt" style="opacity:0;"></div>

  <div class="sec-lbl">📦 단어 카드</div>
  <div class="word-pool" id="wordPool"></div>

  <div class="sec-lbl">✏️ 내 정답</div>
  <div class="ans-pool" id="ansPool"></div>

  <div class="feedback" id="feedback"></div>

  <div class="btn-row">
    <button class="btn-check" onclick="checkAns()">정답 확인 ✓</button>
    <button class="btn-reset"  onclick="resetCards()">↩ 초기화</button>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextSentence()">
    다음 문장 →
  </button>

</div><!-- /gameCard -->

<!-- ══ 완료 화면 ══ -->
<div class="done-card" id="doneCard">
  <div class="done-emoji" id="doneEmoji">🎉</div>
  <div class="done-stars" id="doneStars"></div>
  <div class="done-title">완료! 수고했어요!</div>
  <div class="done-sub"  id="doneSub"></div>
  <button class="btn-restart" onclick="restart()">
    🔄 처음부터 다시 도전하기
  </button>
</div>

<!-- ════════════════════════════════════════
     JavaScript
════════════════════════════════════════ -->
<script>
/* ────────────────────────────────────────
   ① 병음 성조 자동 변환 엔진
   ─ 입력  : "jin1tian1" / "gao1xing4" / "ba"
   ─ 출력  : "jīntiān"  / "gāoxìng"   / "ba"
   ─ 성조 위치 규칙
       1순위) a 또는 e 가 있으면 그 위치
       2순위) ou → o 에 표기
       3순위) 나머지는 마지막 모음
──────────────────────────────────────── */
const TBL = {
  a:['ā','á','ǎ','à','a'],
  e:['ē','é','ě','è','e'],
  i:['ī','í','ǐ','ì','i'],
  o:['ō','ó','ǒ','ò','o'],
  u:['ū','ú','ǔ','ù','u'],
  v:['ǖ','ǘ','ǚ','ǜ','ü'],   /* v = ü 대용 */
};
const VOWELS = ['a','e','i','o','u','v','ü'];

/* 단일 음절 변환: "hao3" → "hǎo" */
function cvtSyl(tok) {
  tok = tok.toLowerCase();
  const m = tok.match(/^([a-züv]+?)([1-4]?)$/);
  if (!m) return tok;
  let [, s, tn] = m;
  s = s.replace(/v/g, 'ü');
  const t = tn ? parseInt(tn) - 1 : 4;   /* 4 = 경성(무변환) */
  if (t === 4) return s;

  const mark = (str, ti) => {
    if (/a/.test(str)) return str.replace('a', TBL.a[ti]);
    if (/e/.test(str)) return str.replace('e', TBL.e[ti]);
    if (/ou/.test(str)) return str.replace('o', TBL.o[ti]);
    /* 마지막 모음 탐색 */
    for (let k = str.length - 1; k >= 0; k--) {
      const c = str[k];
      if (VOWELS.includes(c) && TBL[c])
        return str.slice(0, k) + TBL[c][ti] + str.slice(k + 1);
    }
    return str;
  };
  return mark(s, t);
}

/* 연속 다음절 분리 후 각각 변환: "jintian1" → "jīntiān" */
function cvtToken(tok) {
  return tok
    .split(/(?<=[1-4])(?=[a-züvA-Z])/)
    .map(p => cvtSyl(p))
    .join('');
}

/* 공백 구분 문자열 전체 변환 → 배열 반환 */
function cvtAll(raw) {
  if (!raw.trim()) return [];
  return raw.trim()
    .split(/\s+/)
    .map(t => cvtToken(t.toLowerCase()));
}

/* ────────────────────────────────────────
   ② 문장 원시 데이터 (숫자 성조)
   ─ words  : 카드 단위 공백 구분 병음
   ─ answer : words 배열의 정답 인덱스 순서
──────────────────────────────────────── */
const RAW = [
  {
    /* 今天见到同学们，真高兴 */
    meaning : '오늘 친구(학우)들을 만나니까, 정말 기쁘다',
    words   : ['jin1tian1','jian4dao4','tong2xue2men','zhen1','gao1xing4'],
    answer  : [0, 1, 2, 3, 4]
  },
  {
    /* 我也觉得很高兴 */
    meaning : '나도 기쁘다고 느꼈어',
    words   : ['wo3','ye3','jue2de','hen3','gao1xing4'],
    answer  : [0, 1, 2, 3, 4]
  },
  {
    /* 这个学期我们努力学习吧 */
    meaning : '이번 학기에 우리 열심히 공부하자',
    words   : ['zhe4','ge','xue2qi1','wo3men','nu3li4','xue2xi2','ba'],
    answer  : [0, 1, 2, 3, 4, 5, 6]
  },
  {
    /* 好，我们一起加油 */
    meaning : '우리 함께 힘을 내자',
    words   : ['hao3','wo3men','yi4qi3','jia1you2'],
    answer  : [0, 1, 2, 3]
  }
];

/* ────────────────────────────────────────
   ③ 병음 변환 & 데이터 정제
──────────────────────────────────────── */
const SENTENCES = RAW.map(d => {
  const cv  = cvtAll(d.words.join(' '));

  /* 힌트용: 정답 순서로 이어붙인 전체 병음 */
  const fullPy = d.answer.map(i => cv[i]).join('  ');

  /* 카드 표시용: 첫 카드만 대문자 */
  const words = cv.map((w, i) =>
    i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w
  );

  return { meaning: d.meaning, words, answer: d.answer, fullPy };
});

/* ────────────────────────────────────────
   ④ 게임 상태 변수
──────────────────────────────────────── */
let curIdx    = 0;
let scoreOK   = 0;
let scoreFail = 0;
let streak    = 0;
let maxStreak = 0;
let wPool     = [];   /* { text, origIdx } */
let aPool     = [];   /* { text, origIdx } */

/* ────────────────────────────────────────
   ⑤ 초기 로드
──────────────────────────────────────── */
window.onload = () => loadSentence(0);

function loadSentence(idx) {
  const s = SENTENCES[idx];

  /* 뱃지 & 뜻 */
  document.getElementById('sBadge').textContent = `📝 문장 ${idx + 1}`;
  document.getElementById('mTxt').textContent   = s.meaning;

  /* 힌트 초기화 */
  document.getElementById('hintChk').checked    = false;
  const ht = document.getElementById('hintTxt');
  ht.style.opacity = '0';
  /* 힌트 텍스트: 첫 글자 대문자 */
  ht.textContent =
    s.fullPy.charAt(0).toUpperCase() + s.fullPy.slice(1);

  /* 카드 셔플 */
  const arr = s.words.map((text, i) => ({ text, origIdx: i }));
  shuffle(arr);
  wPool = arr;
  aPool = [];

  /* UI 초기화 */
  setFb('', '');
  rmFlash();
  document.getElementById('btnNext').classList.remove('on');

  updateProg(idx);
  render();
}

/* Fisher-Yates 셔플 */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* ────────────────────────────────────────
   ⑥ 렌더링
──────────────────────────────────────── */
function render() {
  const wp = document.getElementById('wordPool');
  const ap = document.getElementById('ansPool');
  wp.innerHTML = '';
  ap.innerHTML = '';

  wPool.forEach((_, i) =>
    wp.appendChild(mkBtn(wPool[i].text, 'wbtn',       () => toAns(i)))
  );
  aPool.forEach((_, i) =>
    ap.appendChild(mkBtn(aPool[i].text, 'wbtn ans-c', () => toPool(i)))
  );
}

function mkBtn(txt, cls, fn) {
  const b = document.createElement('button');
  b.className   = cls;
  b.textContent = txt;
  b.addEventListener('click', fn);
  return b;
}

/* ────────────────────────────────────────
   ⑦ 카드 이동
──────────────────────────────────────── */
function toAns(i) {
  aPool.push(wPool.splice(i, 1)[0]);
  setFb('', ''); rmFlash(); render();
}
function toPool(i) {
  wPool.push(aPool.splice(i, 1)[0]);
  setFb('', ''); rmFlash(); render();
}

/* ────────────────────────────────────────
   ⑧ 정답 확인
──────────────────────────────────────── */
function checkAns() {
  const s  = SENTENCES[curIdx];
  const ap = document.getElementById('ansPool');

  /* 미배치 카드 있을 때 */
  if (aPool.length !== s.words.length) {
    setFb('⚠️ 모든 카드를 배치해 주세요!', 'no');
    return;
  }

  const ok = aPool.every((w, pos) => w.origIdx === s.answer[pos]);

  if (ok) {
    /* ── 정답 ── */
    ap.classList.add('c-ok');
    setFb('🎉 答对了！(정답) 완벽해요!', 'ok');
    beep(true);
    scoreOK++;
    streak++;
    maxStreak = Math.max(maxStreak, streak);
    updScore();
    document.getElementById('btnNext').classList.add('on');

  } else {
    /* ── 오답 ── */
    ap.classList.add('c-no');
    setFb('💦 再试一次！(다시 도전) 할 수 있어요!', 'no');
    beep(false);
    scoreFail++;
    streak = 0;
    updScore();
    setTimeout(() => { resetCards(); rmFlash(); }, 860);
  }
}

/* ────────────────────────────────────────
   ⑨ 카드 초기화
──────────────────────────────────────── */
function resetCards() {
  const s = SENTENCES[curIdx];
  wPool = s.words.map((text, i) => ({ text, origIdx: i }));
  aPool = [];
  shuffle(wPool);
  setFb('', ''); rmFlash(); render();
}

function rmFlash() {
  document.getElementById('ansPool')
    .classList.remove('c-ok', 'c-no');
}

/* ────────────────────────────────────────
   ⑩ 다음 문장 & 완료
──────────────────────────────────────── */
function nextSentence() {
  curIdx++;
  if (curIdx >= SENTENCES.length) showDone();
  else loadSentence(curIdx);
}

function showDone() {
  document.getElementById('gameCard').style.display = 'none';
  document.getElementById('doneCard').classList.add('on');

  const total = scoreOK + scoreFail;
  const pct   = total ? Math.round(scoreOK / total * 100) : 100;

  let stars, emoji;
  if (pct === 100)    { stars = '⭐⭐⭐'; emoji = '🏆'; }
  else if (pct >= 70) { stars = '⭐⭐';   emoji = '🎉'; }
  else                { stars = '⭐';     emoji = '💪'; }

  document.getElementById('doneEmoji').textContent = emoji;
  document.getElementById('doneStars').textContent = stars;
  document.getElementById('doneSub').innerHTML =
    `총 시도 <b>${total}회</b> 중 <b>${scoreOK}회</b> 정답<br>` +
    `정답률 <b>${pct}%</b> &nbsp;|&nbsp; 최대 연속 <b>${maxStreak}회</b><br><br>` +
    `<span class="jiayou">加油！(jiā yóu!) 계속 함께 공부해요 😊</span>`;

  updateProg(SENTENCES.length);
  fanfare();
}

/* ────────────────────────────────────────
   ⑪ 재시작
──────────────────────────────────────── */
function restart() {
  curIdx = 0; scoreOK = 0; scoreFail = 0;
  streak = 0; maxStreak = 0;
  updScore();
  document.getElementById('gameCard').style.display = '';
  document.getElementById('doneCard').classList.remove('on');
  loadSentence(0);
}

/* ────────────────────────────────────────
   ⑫ 진행 바 & 스코어 업데이트
──────────────────────────────────────── */
function updateProg(idx) {
  const total = SENTENCES.length;
  const pct   = Math.round(idx / total * 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent =
    `문장 ${Math.min(idx + 1, total)} / ${total}`;
  document.getElementById('progPct').textContent   = pct + '%';
}

function updScore() {
  document.getElementById('scOK').textContent     = scoreOK;
  document.getElementById('scFail').textContent   = scoreFail;
  document.getElementById('scStreak').textContent = streak;
}

/* ────────────────────────────────────────
   ⑬ 피드백 & 힌트
──────────────────────────────────────── */
function setFb(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className   = 'feedback ' + (type || '');
}

function toggleHint() {
  const on = document.getElementById('hintChk').checked;
  document.getElementById('hintTxt').style.opacity = on ? '1' : '0';
}

/* ────────────────────────────────────────
   ⑭ 효과음 (Web Audio API)
──────────────────────────────────────── */
function getAC() {
  return new (window.AudioContext || window.webkitAudioContext)();
}

/* 정답 / 오답 효과음 */
function beep(ok) {
  try {
    const ac  = getAC();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);

    if (ok) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, ac.currentTime);
      osc.frequency.setValueAtTime(880, ac.currentTime + .13);
      g.gain.setValueAtTime(.25, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .42);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + .42);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ac.currentTime);
      g.gain.setValueAtTime(.15, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .3);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + .3);
    }
  } catch(e) { /* 오디오 미지원 무시 */ }
}

/* 완료 팡파레: C-E-G-C 6음 */
function fanfare() {
  try {
    const ac = getAC();
    [[523,0],[659,.15],[784,.3],[1047,.48],[784,.66],[1047,.84]]
      .forEach(([freq, t]) => {
        const osc = ac.createOscillator();
        const g   = ac.createGain();
        osc.connect(g); g.connect(ac.destination);
        osc.frequency.value = freq;
        g.gain.setValueAtTime(.2, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .33);
        osc.start(ac.currentTime + t);
        osc.stop(ac.currentTime + t + .36);
      });
  } catch(e) {}
}
</script>
