<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🀄 중국어 어순 배열 게임</title>
<style>
/* ══════════════════════════════
   리셋 & 기본
══════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink:#e91e63;--pink-l:#f48fb1;--pink-ll:#fce4ec;--pink-m:#f8bbd0;
  --blue:#1e88e5;--blue-l:#90caf9;--blue-ll:#e3f2fd;
  --green:#388e3c;--green-l:#a5d6a7;--green-ll:#e8f5e9;
  --purple:#7b1fa2;--purple-l:#ce93d8;--purple-ll:#f3e5f5;
  --yellow-ll:#fffde7;--orange:#ff7043;
  --radius:18px;--shadow:0 8px 32px rgba(233,30,99,.09),0 2px 8px rgba(0,0,0,.06);
}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fce4ec 0%,#f3e5f5 35%,#e8f5e9 70%,#e3f2fd 100%);
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:18px 14px 80px;
}

/* ══════════════════════════════
   헤더
══════════════════════════════ */
.hdr{text-align:center;margin-bottom:16px;}
.hdr h1{
  font-size:1.55rem;font-weight:900;color:var(--pink);
  letter-spacing:-0.5px;text-shadow:0 2px 8px rgba(233,30,99,.15);
}
.hdr p{font-size:.8rem;color:#aaa;margin-top:3px;}

/* ══════════════════════════════
   진행 바
══════════════════════════════ */
.prog-wrap{width:100%;max-width:520px;margin-bottom:12px;}
.prog-top{display:flex;justify-content:space-between;
  font-size:.75rem;color:#bbb;font-weight:700;margin-bottom:5px;}
.prog-bg{background:#f8bbd0;border-radius:50px;height:9px;overflow:hidden;}
.prog-fill{
  background:linear-gradient(90deg,var(--pink-l),var(--pink));
  height:100%;border-radius:50px;transition:width .55s cubic-bezier(.4,0,.2,1);
}

/* ══════════════════════════════
   스코어 뱃지
══════════════════════════════ */
.score-row{
  display:flex;gap:14px;margin-bottom:14px;
}
.sc-box{
  background:#fff;border-radius:14px;padding:8px 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);text-align:center;
  display:flex;align-items:center;gap:8px;
}
.sc-num{font-size:1.35rem;font-weight:900;color:var(--pink);}
.sc-lbl{font-size:.7rem;color:#bbb;font-weight:700;line-height:1.3;}

/* ══════════════════════════════
   메인 카드
══════════════════════════════ */
.card{
  width:100%;max-width:520px;
  background:#fff;border-radius:var(--radius);
  padding:24px 18px 20px;
  box-shadow:var(--shadow);
}

/* 문장 번호 뱃지 */
.s-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--pink-l),var(--pink));
  color:#fff;font-size:.7rem;font-weight:800;
  padding:3px 11px;border-radius:50px;margin-bottom:12px;
  letter-spacing:.6px;
}

/* 한국어 뜻 박스 */
.meaning-box{
  background:linear-gradient(135deg,var(--pink-ll),var(--pink-m));
  border-radius:14px;padding:14px 16px;margin-bottom:16px;
  border-left:4px solid var(--pink);
}
.m-lbl{font-size:.68rem;color:var(--pink);font-weight:800;
  letter-spacing:.6px;margin-bottom:4px;}
.m-txt{font-size:1.12rem;font-weight:800;color:#4a148c;line-height:1.5;}

/* 힌트 */
.hint-row{
  display:flex;align-items:center;gap:7px;
  margin-bottom:10px;cursor:pointer;user-select:none;
}
.hint-row input{accent-color:var(--pink);width:15px;height:15px;}
.hint-row span{font-size:.78rem;color:#bbb;font-weight:600;}
.hint-txt{
  text-align:center;font-size:.83rem;color:#b0bec5;
  letter-spacing:.7px;min-height:20px;margin-bottom:10px;
  transition:opacity .3s;word-break:keep-all;font-style:italic;
}

/* 섹션 레이블 */
.sec-lbl{
  font-size:.68rem;color:#ccc;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;
  display:flex;align-items:center;gap:5px;
}

/* 단어 풀 */
.word-pool{
  display:flex;flex-wrap:wrap;gap:7px;min-height:52px;
  background:#fafafa;border-radius:13px;padding:10px;
  margin-bottom:14px;border:2px dashed var(--pink-m);
  transition:background .2s;
}
.word-pool:empty::after{
  content:"✅ 모든 카드를 배치했어요!";
  color:#e0e0e0;font-size:.8rem;margin:auto;
}

/* 정답 입력 풀 */
.ans-pool{
  display:flex;flex-wrap:wrap;gap:7px;min-height:60px;
  background:#fff5f8;border-radius:13px;padding:10px;
  margin-bottom:16px;border:2.5px solid var(--pink-l);
  transition:border-color .3s,background .3s;position:relative;
}
.ans-pool:empty::after{
  content:"👇 카드를 클릭해 여기에 배치하세요";
  color:#f4bbd0;font-size:.8rem;margin:auto;
}
.ans-pool.correct-flash{
  border-color:#4caf50;background:#f1f8e9;
  animation:cPulse .5s ease;
}
.ans-pool.wrong-flash{
  border-color:#ef5350;background:#fff5f5;
  animation:wShake .42s ease;
}
@keyframes cPulse{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes wShake{0%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}

/* 단어 카드 버튼 */
.wbtn{
  background:linear-gradient(135deg,var(--blue-ll),#bbdefb);
  color:#1565c0;border:2px solid var(--blue-l);
  border-radius:11px;padding:8px 15px;
  font-size:.97rem;font-weight:700;cursor:pointer;
  transition:transform .15s,box-shadow .15s,opacity .15s;
  user-select:none;letter-spacing:.2px;line-height:1.3;
  font-family:inherit;
}
.wbtn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 6px 16px rgba(21,101,192,.2);}
.wbtn:active{transform:scale(.95);}
.wbtn.ans{
  background:linear-gradient(135deg,var(--pink-ll),var(--pink-m));
  color:#880e4f;border-color:var(--pink-l);
}
.wbtn.ans:hover{box-shadow:0 6px 16px rgba(136,14,79,.18);}

/* 피드백 */
.feedback{
  text-align:center;font-size:1.02rem;font-weight:800;
  min-height:28px;margin-bottom:12px;transition:opacity .25s;
  letter-spacing:.2px;
}
.feedback.ok{color:#2e7d32;}
.feedback.no{color:#c62828;}

/* 버튼 그룹 */
.btn-row{display:flex;gap:9px;}
.btn-check{
  flex:1;background:linear-gradient(135deg,var(--pink),#c2185b);
  color:#fff;border:none;border-radius:13px;
  padding:13px 0;font-size:.97rem;font-weight:800;cursor:pointer;
  box-shadow:0 4px 16px rgba(233,30,99,.3);
  transition:opacity .2s,transform .15s;letter-spacing:.2px;
  font-family:inherit;
}
.btn-check:hover{opacity:.92;transform:translateY(-2px);}
.btn-check:active{transform:scale(.97);}
.btn-reset{
  background:#f5f5f5;color:#aaa;border:2px solid #ebebeb;
  border-radius:13px;padding:13px 15px;
  font-size:.88rem;font-weight:700;cursor:pointer;
  transition:background .2s;font-family:inherit;
}
.btn-reset:hover{background:#eee;}
.btn-next{
  width:100%;background:linear-gradient(135deg,#66bb6a,var(--green));
  color:#fff;border:none;border-radius:13px;
  padding:13px 0;font-size:.97rem;font-weight:800;
  cursor:pointer;margin-top:9px;display:none;
  box-shadow:0 4px 16px rgba(56,142,60,.28);
  transition:opacity .2s,transform .15s;font-family:inherit;
  letter-spacing:.2px;
}
.btn-next.on{display:block;}
.btn-next:hover{opacity:.9;transform:translateY(-2px);}

/* ══════════════════════════════
   완료 화면
══════════════════════════════ */
.done-screen{
  display:none;flex-direction:column;align-items:center;
  text-align:center;padding:36px 18px;gap:12px;
}
.done-screen.on{display:flex;}
.done-emoji{font-size:4rem;animation:bob .8s infinite alternate;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-13px)}}
.done-title{font-size:1.55rem;font-weight:900;color:var(--pink);}
.done-sub{font-size:.92rem;color:#888;line-height:1.75;}
.done-stars{font-size:1.6rem;letter-spacing:3px;margin:4px 0;}
.btn-restart{
  background:linear-gradient(135deg,var(--pink),#c2185b);
  color:#fff;border:none;border-radius:13px;
  padding:13px 38px;font-size:.97rem;font-weight:800;
  cursor:pointer;margin-top:6px;
  box-shadow:0 4px 16px rgba(233,30,99,.28);
  transition:opacity .2s;font-family:inherit;
}
.btn-restart:hover{opacity:.9;}

/* ══════════════════════════════
   모바일 반응형
══════════════════════════════ */
@media(max-width:400px){
  .hdr h1{font-size:1.3rem;}
  .m-txt{font-size:1rem;}
  .wbtn{font-size:.88rem;padding:7px 12px;}
}
</style>
</head>
<body>

<!-- ══ 헤더 ══ -->
<div class="hdr">
  <h1>🀄 중국어 어순 배열 게임</h1>
  <p>카드를 클릭해 올바른 어순으로 배열하세요!</p>
</div>

<!-- ══ 진행 바 ══ -->
<div class="prog-wrap">
  <div class="prog-top">
    <span id="progLabel">문장 1 / 4</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<!-- ══ 스코어 ══ -->
<div class="score-row">
  <div class="sc-box">
    <div>
      <div class="sc-num" id="scOK">0</div>
      <div class="sc-lbl">✅ 정답</div>
    </div>
  </div>
  <div class="sc-box">
    <div>
      <div class="sc-num" id="scFail">0</div>
      <div class="sc-lbl">❌ 오답</div>
    </div>
  </div>
  <div class="sc-box">
    <div>
      <div class="sc-num" id="scStreak">0</div>
      <div class="sc-lbl">🔥 연속</div>
    </div>
  </div>
</div>

<!-- ══ 게임 카드 ══ -->
<div class="card" id="gameCard">
  <div class="s-badge" id="sBadge">📝 문장 1</div>

  <!-- 한국어 뜻 -->
  <div class="meaning-box">
    <div class="m-lbl">💬 한국어 뜻</div>
    <div class="m-txt" id="mTxt"></div>
  </div>

  <!-- 힌트 -->
  <label class="hint-row">
    <input type="checkbox" id="hintChk" onchange="toggleHint()"/>
    <span>🔍 전체 병음 힌트 보기</span>
  </label>
  <div class="hint-txt" id="hintTxt" style="opacity:0;"></div>

  <!-- 단어 카드 풀 -->
  <div class="sec-lbl">📦 단어 카드</div>
  <div class="word-pool" id="wordPool"></div>

  <!-- 정답 입력창 -->
  <div class="sec-lbl">✏️ 내 정답</div>
  <div class="ans-pool" id="ansPool"></div>

  <!-- 피드백 -->
  <div class="feedback" id="feedback"></div>

  <!-- 버튼 -->
  <div class="btn-row">
    <button class="btn-check" onclick="checkAns()">정답 확인 ✓</button>
    <button class="btn-reset" onclick="resetCards()">↩ 초기화</button>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextSentence()">다음 문장 →</button>
</div>

<!-- ══ 완료 화면 ══ -->
<div class="card done-screen" id="doneScreen">
  <div class="done-emoji" id="doneEmoji">🎉</div>
  <div class="done-stars" id="doneStars"></div>
  <div class="done-title">완료! 수고했어요!</div>
  <div class="done-sub" id="doneSub"></div>
  <button class="btn-restart" onclick="restart()">🔄 처음부터 다시하기</button>
</div>

<!-- ══════════════════════════════════════════
     JavaScript
══════════════════════════════════════════ -->
<script>
/* ────────────────────────────────────────
   ① 성조 자동 변환 엔진
   입력: "hao3jiu3" 또는 "hao3 jiu3"
   출력: "hǎojiǔ" 또는 "hǎo jiǔ"
──────────────────────────────────────── */
const TONES={
  a:['ā','á','ǎ','à','a'],
  e:['ē','é','ě','è','e'],
  i:['ī','í','ǐ','ì','i'],
  o:['ō','ó','ǒ','ò','o'],
  u:['ū','ú','ǔ','ù','u'],
  v:['ǖ','ǘ','ǚ','ǜ','ü'],  // v = ü 대용
};

/**
 * 단일 음절 "hao3" → "hǎo"
 */
function cvtSyllable(tok){
  const m = tok.match(/^([a-züv]+)([1-4]?)$/i);
  if(!m) return tok;
  let [,syl,tn] = m;
  syl = syl.toLowerCase();
  const t = tn ? parseInt(tn)-1 : 4; // 4 = 경성
  if(t===4) return syl.replace(/v/g,'ü');

  syl = syl.replace(/v/g,'ü');

  // 표준 성조 위치 규칙
  // 1) a, e 가 있으면 그곳에
  // 2) ou 는 o에
  // 3) 나머지는 마지막 모음에
  function mark(s,ti){
    if(/a/.test(s)) return s.replace('a', TONES.a[ti]);
    if(/e/.test(s)) return s.replace('e', TONES.e[ti]);
    if(/ou/.test(s)) return s.replace('o', TONES.o[ti]);
    // 마지막 모음
    const vows=['a','e','i','o','u','ü'];
    for(let k=s.length-1;k>=0;k--){
      if(vows.includes(s[k])){
        const v=s[k];
        return s.slice(0,k)+(TONES[v]?TONES[v][ti]:v)+s.slice(k+1);
      }
    }
    return s;
  }
  return mark(syl, t);
}

/**
 * 토큰 하나 전처리: "hao3jiu3" → ["hao3","jiu3"] → "hǎojiǔ"
 * 공백 없이 붙은 다음절 처리: 숫자(1-4) 뒤에서 분리
 */
function cvtToken(token){
  // 숫자 경계로 분리
  const parts = token.split(/(?<=[1-4])(?=[a-züvA-Z])/);
  return parts.map(p=>cvtSyllable(p)).join('');
}

/**
 * 입력 문자열 전체 변환
 * "hao3 jiu3 bu4 jian4" → ["hǎo","jiǔ","bù","jiàn"]
 */
function convertPinyin(raw){
  return raw.trim().split(/\s+/).map(t=>cvtToken(t.toLowerCase()));
}

/* ────────────────────────────────────────
   ② 문장 데이터
   words: 원래 병음 배열 (숫자성조)
   answer: words 배열의 정답 인덱스 순서
──────────────────────────────────────── */
const RAW_DATA = [
  {
    meaning: "오래간만이야",
    words:  ["hao3jiu3","bu2","jian4"],
    answer: [0, 1, 2]
  },
  {
    meaning: "여름방학은 어떻게 지냈어?",
    words:  ["guo4","shu3jia4","zen3meyang4","de"],
    answer: [1, 0, 3, 2]
  },
  {
    meaning: "난 매일 책 읽고, 운동했어",
    words:  ["wo3","yun4dong4","mei3tian1","kan4shu1"],
    answer: [0, 2, 3, 1]
  },
  {
    meaning: "대단히 잘 지냈어",
    words:  ["fei1chang2","guo4","de","hao3"],
    answer: [1, 2, 0, 3]
  }
];

/* ────────────────────────────────────────
   ③ 변환 & 데이터 준비
──────────────────────────────────────── */
const SENTENCES = RAW_DATA.map(d=>{
  const cvted = convertPinyin(d.words.join(' '));
  const fullPinyin = d.answer.map(i=>cvted[i]).join(' ');
  // 첫 글자 대문자
  const words = cvted.map((w,i)=>
    i===0 ? w.charAt(0).toUpperCase()+w.slice(1) : w
  );
  return { meaning:d.meaning, words, answer:d.answer, fullPinyin };
});

/* ────────────────────────────────────────
   ④ 게임 상태
──────────────────────────────────────── */
let curIdx    = 0;
let scoreOK   = 0;
let scoreFail = 0;
let streak    = 0;
let wPool     = [];  // {text, origIdx}
let aPool     = [];  // {text, origIdx}

/* ────────────────────────────────────────
   ⑤ 초기화 & 문장 로드
──────────────────────────────────────── */
window.onload = ()=>{ loadSentence(0); };

function loadSentence(idx){
  const s = SENTENCES[idx];

  // UI 업데이트
  document.getElementById('sBadge').textContent  = `📝 문장 ${idx+1}`;
  document.getElementById('mTxt').textContent    = s.meaning;

  // 힌트
  const hc = document.getElementById('hintChk');
  hc.checked = false;
  const ht = document.getElementById('hintTxt');
  ht.style.opacity = '0';
  // 힌트: 정답 순서 병음
  ht.textContent = s.fullPinyin.charAt(0).toUpperCase() + s.fullPinyin.slice(1);

  // 카드 셔플
  const shuffled = s.words.map((text,i)=>({text,origIdx:i}));
  fisherYates(shuffled);
  wPool = shuffled;
  aPool = [];

  // 상태 초기화
  setFb('','');
  document.getElementById('btnNext').classList.remove('on');

  // 진행 바
  updateProg(idx);
  renderAll();
}

function fisherYates(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

/* ────────────────────────────────────────
   ⑥ 렌더링
──────────────────────────────────────── */
function renderAll(){
  const wp = document.getElementById('wordPool');
  const ap = document.getElementById('ansPool');
  wp.innerHTML=''; ap.innerHTML='';

  wPool.forEach((_,i)=>{
    wp.appendChild(mkBtn(wPool[i].text,'wbtn',()=>toAns(i)));
  });
  aPool.forEach((_,i)=>{
    ap.appendChild(mkBtn(aPool[i].text,'wbtn ans',()=>toPool(i)));
  });
}

function mkBtn(txt,cls,fn){
  const b=document.createElement('button');
  b.className=cls; b.textContent=txt;
  b.addEventListener('click',fn);
  return b;
}

/* ────────────────────────────────────────
   ⑦ 카드 이동
──────────────────────────────────────── */
function toAns(i){
  aPool.push(wPool[i]); wPool.splice(i,1);
  setFb('',''); rmFlash(); renderAll();
}
function toPool(i){
  wPool.push(aPool[i]); aPool.splice(i,1);
  setFb('',''); rmFlash(); renderAll();
}

/* ────────────────────────────────────────
   ⑧ 정답 확인
──────────────────────────────────────── */
function checkAns(){
  const s = SENTENCES[curIdx];
  if(aPool.length !== s.words.length){
    setFb('⚠️ 모든 카드를 배치해 주세요!','no'); return;
  }
  const ok = aPool.every((w,pos)=> w.origIdx === s.answer[pos]);
  const ap = document.getElementById('ansPool');

  if(ok){
    ap.classList.add('correct-flash');
    setFb('🎉 答对了!(정답) 완벽해요!','ok');
    beep(true);
    scoreOK++; streak++;
    document.getElementById('scOK').textContent   = scoreOK;
    document.getElementById('scStreak').textContent = streak;
    document.getElementById('btnNext').classList.add('on');
  } else {
    ap.classList.add('wrong-flash');
    setFb('💦 再试一次!(다시 도전) 할 수 있어요!','no');
    beep(false);
    scoreFail++; streak=0;
    document.getElementById('scFail').textContent   = scoreFail;
    document.getElementById('scStreak').textContent = streak;
    setTimeout(()=>{ resetCards(); rmFlash(); }, 820);
  }
}

/* ────────────────────────────────────────
   ⑨ 초기화
──────────────────────────────────────── */
function resetCards(){
  const s = SENTENCES[curIdx];
  wPool   = s.words.map((text,i)=>({text,origIdx:i}));
  aPool   = [];
  fisherYates(wPool);
  setFb('',''); rmFlash(); renderAll();
}

function rmFlash(){
  const ap=document.getElementById('ansPool');
  ap.classList.remove('correct-flash','wrong-flash');
}

/* ────────────────────────────────────────
   ⑩ 다음 문장 & 완료
──────────────────────────────────────── */
function nextSentence(){
  curIdx++;
  if(curIdx>=SENTENCES.length){ showDone(); }
  else { loadSentence(curIdx); }
}

function showDone(){
  document.getElementById('gameCard').style.display='none';
  const ds=document.getElementById('doneScreen');
  ds.classList.add('on');

  const total=scoreOK+scoreFail;
  const pct  =total?Math.round(scoreOK/total*100):100;
  const stars = pct===100?'⭐⭐⭐': pct>=70?'⭐⭐': '⭐';
  const emoji = pct===100?'🏆': pct>=70?'🎉':'💪';

  document.getElementById('doneEmoji').textContent = emoji;
  document.getElementById('doneStars').textContent = stars;
  document.getElementById('doneSub').innerHTML =
    `총 시도 <b>${total}회</b> 중 <b>${scoreOK}회</b> 정답<br>`+
    `정답률 <b>${pct}%</b> &nbsp;|&nbsp; 최대 연속 정답 <b>${streak}회</b><br><br>`+
    `加油!(jiā yóu!) 계속 연습해요 😊`;

  updateProg(SENTENCES.length);
  playFanfare();
}

/* ────────────────────────────────────────
   ⑪ 재시작
──────────────────────────────────────── */
function restart(){
  curIdx=0; scoreOK=0; scoreFail=0; streak=0;
  ['scOK','scFail','scStreak'].forEach(id=>{
    document.getElementById(id).textContent='0';
  });
  document.getElementById('gameCard').style.display='';
  document.getElementById('doneScreen').classList.remove('on');
  loadSentence(0);
}

/* ────────────────────────────────────────
   ⑫ 진행 바 업데이트
──────────────────────────────────────── */
function updateProg(idx){
  const total=SENTENCES.length;
  const pct  =Math.round(idx/total*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent =
    `문장 ${Math.min(idx+1,total)} / ${total}`;
  document.getElementById('progPct').textContent  = pct+'%';
}

/* ────────────────────────────────────────
   ⑬ 피드백 & 힌트
──────────────────────────────────────── */
function setFb(msg,type){
  const el=document.getElementById('feedback');
  el.textContent=msg;
  el.className='feedback '+(type||'');
}
function toggleHint(){
  const chk=document.getElementById('hintChk').checked;
  document.getElementById('hintTxt').style.opacity=chk?'1':'0';
}

/* ────────────────────────────────────────
   ⑭ 효과음 (Web Audio API)
──────────────────────────────────────── */
function getCtx(){
  return new(window.AudioContext||window.webkitAudioContext)();
}
function beep(ok){
  try{
    const ctx=getCtx();
    const osc=ctx.createOscillator();
    const g  =ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    if(ok){
      osc.type='sine';
      osc.frequency.setValueAtTime(660,ctx.currentTime);
      osc.frequency.setValueAtTime(880,ctx.currentTime+.12);
      g.gain.setValueAtTime(.25,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.38);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime+.38);
    }else{
      osc.type='sawtooth';
      osc.frequency.setValueAtTime(200,ctx.currentTime);
      g.gain.setValueAtTime(.15,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime+.28);
    }
  }catch(e){}
}
function playFanfare(){
  try{
    const ctx=getCtx();
    [[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8]].forEach(([f,t])=>{
      const osc=ctx.createOscillator();
      const g  =ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value=f;
      g.gain.setValueAtTime(.2,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.32);
      osc.start(ctx.currentTime+t);
      osc.stop(ctx.currentTime+t+.35);
    });
  }catch(e){}
}
</script>
