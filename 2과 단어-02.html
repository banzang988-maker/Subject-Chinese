<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>🀄 중국어 단어 맞추기</title>
<style>
/* ══════════════════════════════
   CSS 변수 & 전역 리셋
══════════════════════════════ */
:root{
  --pk:#f06292; --pk2:#e91e63;
  --pu:#ab47bc;
  --in:#7c4dff;
  --mt:#4db6ac; --gn:#66bb6a;
  --bg:#fdf6ff;
  --text1:#2d1b4e; --text2:#6a4a8a; --text3:#b39ddb;
  --border:#e8d8f8;
  --shadow:0 8px 32px rgba(124,77,255,.13);
  --r:22px; --rm:14px; --rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 10% 15%,rgba(240,98,146,.09) 0%,transparent 45%),
    radial-gradient(circle at 90% 80%,rgba(124,77,255,.09) 0%,transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(77,182,172,.05) 0%,transparent 65%);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:70px;
}

/* ══════════════════════════════
   헤더
══════════════════════════════ */
.hdr{
  width:100%;max-width:680px;
  padding:26px 20px 8px;text-align:center;
}
.hdr-title{
  font-size:1.6rem;font-weight:900;letter-spacing:.3px;
  background:linear-gradient(90deg,var(--pk2),var(--pu),var(--in));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hdr-sub{
  font-size:.76rem;color:var(--text3);font-weight:600;
  margin-top:3px;letter-spacing:.8px;
}

/* ══════════════════════════════
   진행바
══════════════════════════════ */
.prog-wrap{width:calc(100% - 36px);max-width:640px;margin-top:6px;}
.prog-row{
  display:flex;justify-content:space-between;
  font-size:.73rem;font-weight:700;color:var(--text2);margin-bottom:5px;
}
.prog-track{
  height:10px;background:#ead8f8;border-radius:99px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
}
.prog-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--pk),var(--pu),var(--in));
  transition:width .6s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px rgba(124,77,255,.38);
}

/* ══════════════════════════════
   세트 배지 + Q 도트
══════════════════════════════ */
.set-row{text-align:center;margin-top:13px;}
.set-badge{
  display:inline-block;padding:5px 22px;border-radius:99px;
  font-size:.76rem;font-weight:800;color:#fff;letter-spacing:.8px;
  box-shadow:0 3px 14px rgba(0,0,0,.15);transition:all .4s;
}
.s1{background:linear-gradient(90deg,var(--pk),var(--pu));}
.s2{background:linear-gradient(90deg,var(--mt),var(--gn));}

.q-dots{display:flex;justify-content:center;gap:8px;margin-top:10px;}
.qdot{
  width:11px;height:11px;border-radius:50%;background:#e0cff5;
  transition:all .35s;
}
.qdot.done{background:var(--pu);}
.qdot.cur{
  background:var(--pk);transform:scale(1.55);
  box-shadow:0 0 0 3px rgba(240,98,146,.25);
}

/* ══════════════════════════════
   메인 게임 박스
══════════════════════════════ */
.game-box{
  width:calc(100% - 24px);max-width:660px;
  background:rgba(255,255,255,.84);
  border-radius:var(--r);box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,255,255,.95);
  padding:20px 16px 22px;margin-top:13px;
}

/* ── 공통 섹션 라벨 ── */
.sec-label{
  font-size:.66rem;font-weight:800;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.5px;
  text-align:center;margin-bottom:8px;
}

/* ── 한국어 뜻 패널 ── */
.ko-box{
  background:linear-gradient(135deg,#f9f0ff,#eef0ff);
  border:2px solid rgba(171,71,188,.13);border-radius:var(--rm);
  min-height:86px;padding:14px 18px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.ko-text{
  font-size:2.45rem;font-weight:900;color:var(--text1);
  line-height:1.25;text-align:center;word-break:keep-all;
  transition:font-size .2s;
}
.ko-text.md{font-size:1.85rem;}
.ko-text.sm{font-size:1.38rem;}

/* ── 클릭 안내 배너 ── */
.guide-banner{
  display:flex;gap:7px;justify-content:center;
  margin-bottom:13px;flex-wrap:wrap;
}
.g-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 12px;border-radius:99px;
  font-size:.71rem;font-weight:700;border:1.5px solid;
}
.chip1{color:#7c4dff;background:#f0ebff;border-color:#c5b3f7;}
.chip2{color:#e91e63;background:#fce4ec;border-color:#f8bbd0;}

/* ══════════════════════════════
   단어 카드 그리드
   7개 → 4+3 레이아웃 (4열)
══════════════════════════════ */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;margin-bottom:18px;
}
/* 7개일 때 마지막 줄 3개 가운데 정렬 트릭 */
.cards-grid.n7{
  grid-template-columns:repeat(4,1fr);
}

@media(max-width:480px){
  .cards-grid{grid-template-columns:repeat(3,1fr);}
  .cards-grid.n7{grid-template-columns:repeat(3,1fr);}
  .ko-text{font-size:2rem;}
  .ko-text.md{font-size:1.55rem;}
  .ko-text.sm{font-size:1.15rem;}
}
@media(max-width:340px){
  .cards-grid{grid-template-columns:repeat(2,1fr);}
  .cards-grid.n7{grid-template-columns:repeat(2,1fr);}
}

/* ── 단어 카드 버튼 ── */
.wcard{
  background:#fff;
  border:2.5px solid var(--border);border-radius:var(--rm);
  padding:15px 6px 13px;cursor:pointer;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;
  min-height:118px;
  transition:
    transform .22s cubic-bezier(.34,1.56,.64,1),
    box-shadow .22s,border-color .22s,background .22s,opacity .22s;
  box-shadow:0 3px 12px rgba(171,71,188,.10);
  position:relative;overflow:hidden;user-select:none;
}
.wcard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--rm) var(--rm) 0 0;
  background:linear-gradient(90deg,var(--pk),var(--in));
  opacity:0;transition:opacity .22s;
}
.wcard:hover:not(.dis){
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 10px 26px rgba(171,71,188,.22);
  border-color:#ce93d8;
}
.wcard:hover:not(.dis)::before{opacity:1;}
.wcard:active:not(.dis){transform:scale(.97);}

/* 1클릭: 발음 재생 상태 */
.wcard.heard{
  border-color:var(--in);
  background:linear-gradient(135deg,#ede7f6,#e8eaf6);
  box-shadow:0 5px 18px rgba(124,77,255,.22);
}
.wcard.heard::before{
  background:linear-gradient(90deg,var(--in),var(--pu));opacity:1;
}
/* 2클릭: 정답창 이동 상태 */
.wcard.sel{
  background:linear-gradient(135deg,#fff0f5,#fce4ec);
  border-color:var(--pk);transform:scale(.96);
  box-shadow:0 3px 10px rgba(240,98,146,.2);opacity:.65;
}
.wcard.sel::before{
  background:linear-gradient(90deg,var(--pk),#f8bbd0);opacity:1;
}
/* 비활성 */
.wcard.dis{opacity:.25;pointer-events:none;}

/* 정답/오답 플래시 */
.wcard.ok-fl{
  background:linear-gradient(135deg,#e8f5e9,#c8e6c9)!important;
  border-color:var(--gn)!important;animation:okPop .55s ease;
}
.wcard.ng-fl{
  background:linear-gradient(135deg,#ffebee,#ffcdd2)!important;
  border-color:#ef5350!important;animation:ngShake .42s ease;
}
@keyframes okPop{
  0%{transform:scale(1);}45%{transform:scale(1.09);}100%{transform:scale(1);}
}
@keyframes ngShake{
  0%,100%{transform:translateX(0);}
  22%{transform:translateX(-9px);}
  66%{transform:translateX(9px);}
}

/* ── 카드 텍스트 ── */
.c-py{
  font-size:1.45rem;font-weight:800;color:var(--in);
  line-height:1.2;letter-spacing:.3px;
  word-break:break-word;text-align:center;
}
.c-hz{
  font-size:1.6rem;font-weight:700;color:var(--text1);
  line-height:1.1;letter-spacing:1.5px;text-align:center;
}
.c-state{font-size:.95rem;margin-top:1px;transition:all .25s;}

/* ── 정답 입력창 ── */
.ans-box{
  min-height:118px;background:#faf7ff;
  border:2.5px dashed #cdb8f0;border-radius:var(--rm);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:5px;
  margin-bottom:13px;padding:13px;transition:all .3s;
}
.ans-box.filled{
  border-style:solid;border-color:var(--pk);
  background:linear-gradient(135deg,#fff8fb,#fce4ec);
}
.ans-ph{
  font-size:.88rem;color:#c9b4e8;font-weight:600;
  text-align:center;line-height:1.75;
}
.ans-inner{
  display:none;flex-direction:column;align-items:center;gap:7px;
  animation:popIn .32s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{
  from{transform:scale(.5) translateY(14px);opacity:0;}
  to  {transform:scale(1)  translateY(0);   opacity:1;}
}
.ans-inner .a-py{
  font-size:2.1rem;font-weight:800;color:#c2185b;
  line-height:1.2;text-align:center;
}
.ans-inner .a-hz{
  font-size:2.3rem;font-weight:700;color:var(--text1);
  letter-spacing:3px;text-align:center;
}
.ans-hint{font-size:.68rem;color:var(--pk);font-weight:700;margin-top:1px;}

/* ── 피드백 띠 ── */
.fb{
  min-height:36px;text-align:center;font-size:1.04rem;
  font-weight:800;border-radius:var(--rs);padding:6px 12px;
  margin-bottom:12px;transition:all .3s;letter-spacing:.2px;
}
.fb.ok{
  background:linear-gradient(90deg,#e8f5e9,#f1f8e9);
  color:#2e7d32;border:1.5px solid #a5d6a7;
}
.fb.ng{
  background:linear-gradient(90deg,#ffebee,#fce4ec);
  color:#b71c1c;border:1.5px solid #ef9a9a;
}

/* ── 버튼들 ── */
.btn-check{
  width:100%;padding:15px;font-size:1.03rem;font-weight:800;
  color:#fff;border:none;border-radius:var(--rm);
  background:linear-gradient(90deg,var(--pk2),var(--pu),var(--in));
  background-size:200% auto;
  box-shadow:0 5px 20px rgba(124,77,255,.28);cursor:pointer;
  transition:background-position .4s,transform .18s,box-shadow .18s;
  letter-spacing:.4px;
}
.btn-check:hover{
  background-position:right center;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,77,255,.36);
}
.btn-check:active{transform:scale(.97);}
.btn-check:disabled{
  background:#e0e0e0!important;color:#bbb;
  box-shadow:none;cursor:not-allowed;transform:none;
}
.btn-next{
  width:100%;padding:13px;font-size:.98rem;font-weight:800;
  color:#fff;border:none;border-radius:var(--rm);
  background:linear-gradient(90deg,var(--mt),var(--gn));
  box-shadow:0 5px 18px rgba(102,187,106,.28);cursor:pointer;
  margin-top:9px;letter-spacing:.4px;
  transition:transform .18s,box-shadow .18s;display:none;
}
.btn-next.on{
  display:block;
  animation:slideUp .38s cubic-bezier(.34,1.56,.64,1);
}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(102,187,106,.4);}
.btn-next:active{transform:scale(.97);}
@keyframes slideUp{
  from{opacity:0;transform:translateY(22px);}
  to  {opacity:1;transform:translateY(0);}
}

/* ══════════════════════════════
   완료 화면
══════════════════════════════ */
.done-wrap{
  display:none;
  width:calc(100% - 24px);max-width:660px;
  background:rgba(255,255,255,.9);
  border-radius:var(--r);box-shadow:var(--shadow);
  border:1.5px solid rgba(255,255,255,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:50px 28px 46px;margin-top:20px;
  flex-direction:column;align-items:center;text-align:center;
}
.done-wrap.show{display:flex;}
.done-emoji{
  font-size:5rem;
  animation:bounce .9s ease-in-out infinite alternate;
}
@keyframes bounce{
  from{transform:translateY(0);}to{transform:translateY(-16px);}
}
.done-wrap h2{
  font-size:1.9rem;font-weight:900;margin:15px 0 8px;
  background:linear-gradient(90deg,var(--pk2),var(--pu),var(--in));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.done-wrap p{color:var(--text2);font-size:.93rem;font-weight:600;line-height:1.85;}
.score-box{
  margin:20px 0;padding:18px 44px;
  background:linear-gradient(135deg,#f3e5f5,#e8eaf6);
  border-radius:var(--rm);
  box-shadow:0 4px 18px rgba(124,77,255,.12);
}
.score-num{
  font-size:3.2rem;font-weight:900;
  background:linear-gradient(90deg,var(--pk),var(--in));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.score-lbl{font-size:.78rem;color:var(--text3);font-weight:700;margin-top:3px;}
.btn-restart{
  padding:14px 44px;font-size:.98rem;font-weight:800;
  color:#fff;border:none;border-radius:99px;
  background:linear-gradient(90deg,var(--pk2),var(--pu),var(--in));
  box-shadow:0 5px 20px rgba(124,77,255,.28);cursor:pointer;
  transition:transform .2s,box-shadow .2s;letter-spacing:.4px;
}
.btn-restart:hover{transform:scale(1.05);box-shadow:0 9px 26px rgba(124,77,255,.4);}

/* ── 물결 효과 ── */
.rpl{
  position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(124,77,255,.18);transform:scale(0);
  animation:rplAni .55s linear;
}
@keyframes rplAni{to{transform:scale(5);opacity:0;}}
</style>
</head>
<body>

<!-- ══ 헤더 ══ -->
<div class="hdr">
  <h1 class="hdr-title">🀄 중국어 단어 맞추기</h1>
  <p class="hdr-sub">Chinese Vocab Quiz · 单词配对游戏</p>
</div>

<!-- ══ 진행바 ══ -->
<div class="prog-wrap">
  <div class="prog-row">
    <span id="pLabel">1 / 14</span>
    <span id="pPct">0%</span>
  </div>
  <div class="prog-track">
    <div class="prog-fill" id="pFill" style="width:0%"></div>
  </div>
</div>

<!-- ══ 게임 박스 ══ -->
<div class="game-box" id="gameBox">

  <!-- 세트 배지 + Q 도트 -->
  <div class="set-row">
    <span class="set-badge s1" id="setBadge">세트 1 · 7문제</span>
  </div>
  <div class="q-dots" id="qDots"></div>

  <!-- 한국어 뜻 -->
  <div style="margin-top:16px;">
    <div class="sec-label">💬 이 뜻에 맞는 중국어 단어는?</div>
    <div class="ko-box">
      <div class="ko-text" id="koText">…</div>
    </div>
  </div>

  <!-- 클릭 안내 배너 -->
  <div class="guide-banner">
    <span class="g-chip chip1">🔊 1번째 클릭 → 발음 듣기</span>
    <span class="g-chip chip2">✅ 2번째 클릭 → 정답창으로</span>
  </div>

  <!-- 단어 카드 -->
  <div class="sec-label">🃏 단어 카드</div>
  <div class="cards-grid" id="cardsGrid"></div>

  <!-- 정답 입력창 -->
  <div class="sec-label">✏️ 정답 입력창</div>
  <div class="ans-box" id="ansBox">
    <div class="ans-ph" id="ansPH">
      카드를 <strong>두 번</strong> 클릭하면<br>여기로 이동해요 👆
    </div>
    <div class="ans-inner" id="ansInner"></div>
  </div>

  <!-- 피드백 -->
  <div class="fb" id="fb"></div>

  <!-- 버튼 -->
  <button class="btn-check" id="btnCheck" disabled onclick="checkAns()">
    ✅ 정답 확인
  </button>
  <button class="btn-next" id="btnNext" onclick="nextQ()">
    다음 문제 ▶
  </button>
</div>

<!-- ══ 완료 화면 ══ -->
<div class="done-wrap" id="doneWrap">
  <div class="done-emoji">🎉</div>
  <h2>완전 완료!</h2>
  <p>
    두 세트 모두 훌륭하게 마쳤어요!<br>
    중국어 실력이 쑥쑥 자라고 있어요 🌱<br>
    <span style="color:var(--pk);font-size:1.15rem;font-weight:900;">
      好棒！太厉害了！
    </span>
  </p>
  <div class="score-box">
    <div class="score-num" id="scoreNum">0 / 14</div>
    <div class="score-lbl">최종 정답 수</div>
  </div>
  <button class="btn-restart" onclick="startGame()">🔄 처음부터 다시</button>
</div>

<script>
/* ══════════════════════════════════════════
   ❶ 데이터 — 성조 부호 직접 표기
══════════════════════════════════════════ */
const SETS = [
  {
    name:"세트 1", cls:"s1",
    words:[
      { hz:"欢迎", py:"huānyíng", ko:"환영하다",         tts:"欢迎" },
      { hz:"条件", py:"tiáojiàn", ko:"조건",              tts:"条件" },
      { hz:"只要", py:"zhǐyào",   ko:"~하기만 하면",      tts:"只要" },
      { hz:"快",   py:"kuài",     ko:"빨리",              tts:"快"   },
      { hz:"时间", py:"shíjiān",  ko:"시간",              tts:"时间" },
      { hz:"从",   py:"cóng",     ko:"~부터",             tts:"从"   },
      { hz:"到",   py:"dào",      ko:"~까지",             tts:"到"   },
    ]
  },
  {
    name:"세트 2", cls:"s2",
    words:[
      { hz:"联系", py:"liánxì",   ko:"연락(하다)",        tts:"联系" },
      { hz:"方式", py:"fāngshì",  ko:"방식",              tts:"方式" },
      { hz:"加入", py:"jiārù",    ko:"가입하다",          tts:"加入" },
      { hz:"生活", py:"shēnghuó", ko:"생활",              tts:"生活" },
      { hz:"会",   py:"huì",      ko:"~할 것이다",        tts:"会"   },
      { hz:"更",   py:"gèng",     ko:"더욱",              tts:"更"   },
      { hz:"精彩", py:"jīngcǎi",  ko:"근사하다, 다채롭다", tts:"精彩" },
    ]
  }
];

const TOTAL = SETS.reduce((s,t)=>s+t.words.length, 0); // 14

/* ══════════════════════════════════════════
   ❷ 상태 변수
══════════════════════════════════════════ */
let SI=0, QI=0, GI=0;
let qOrder=[];
let correctCnt=0;
let answered=false;

// clickMap[wIdx]: 0=미클릭 | 1=1클릭(발음) | 2=2클릭(정답창)
let clickMap={};
let selIdx=null;

/* ══════════════════════════════════════════
   ❸ 유틸 — 셔플
══════════════════════════════════════════ */
const shuffle = a => {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
};

/* ══════════════════════════════════════════
   ❹ TTS — 중국어 발음
══════════════════════════════════════════ */
let zhVoice=null;
function loadVoices(){
  if(!window.speechSynthesis)return;
  const vs=speechSynthesis.getVoices();
  zhVoice = vs.find(v=>v.lang==='zh-CN')
          ||vs.find(v=>v.lang==='zh-TW')
          ||vs.find(v=>v.lang.startsWith('zh'))
          ||null;
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=loadVoices;
  loadVoices();
}
function speak(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.82; u.pitch=1.05;
  if(!zhVoice)loadVoices();
  if(zhVoice)u.voice=zhVoice;
  speechSynthesis.speak(u);
}

/* ══════════════════════════════════════════
   ❺ 효과음 — Web Audio API
══════════════════════════════════════════ */
let _ac=null;
const ac=()=>{
  if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
  return _ac;
};

function sfxClick(){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';
    o.frequency.setValueAtTime(660,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.08);
    g.gain.setValueAtTime(.18,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);
    o.start();o.stop(ctx.currentTime+.13);
  }catch(e){}
}

function sfxSelect(){
  try{
    const ctx=ac();
    [[440,.00],[550,.07],[660,.14]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      const st=ctx.currentTime+t;
      g.gain.setValueAtTime(.15,st);
      g.gain.exponentialRampToValueAtTime(.001,st+.14);
      o.start(st);o.stop(st+.16);
    });
  }catch(e){}
}

function sfxOK(){
  try{
    const ctx=ac();
    [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.36]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      const st=ctx.currentTime+t;
      g.gain.setValueAtTime(.28,st);
      g.gain.exponentialRampToValueAtTime(.001,st+.28);
      o.start(st);o.stop(st+.3);
    });
  }catch(e){}
}

function sfxNG(){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(280,ctx.currentTime);
    o.frequency.linearRampToValueAtTime(130,ctx.currentTime+.38);
    g.gain.setValueAtTime(.18,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.42);
    o.start();o.stop(ctx.currentTime+.44);
  }catch(e){}
}

function sfxDone(){
  try{
    const ctx=ac();
    [523,659,784,1047,1319,1568,2093].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      const t=ctx.currentTime+i*.13;
      g.gain.setValueAtTime(.22,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.start(t);o.stop(t+.38);
    });
  }catch(e){}
}

function ripple(btn,e){
  const r=document.createElement('span');r.className='rpl';
  const rect=btn.getBoundingClientRect();
  const sz=Math.max(btn.offsetWidth,btn.offsetHeight);
  r.style.cssText=
    `width:${sz}px;height:${sz}px;`+
    `left:${(e.clientX||rect.left+rect.width/2)-rect.left-sz/2}px;`+
    `top:${(e.clientY||rect.top+rect.height/2)-rect.top-sz/2}px;`;
  btn.appendChild(r);
  setTimeout(()=>r.remove(),560);
}

/* ══════════════════════════════════════════
   ❻ 게임 초기화 / 세트 시작
══════════════════════════════════════════ */
function startGame(){
  SI=QI=GI=correctCnt=0;
  document.getElementById('gameBox').style.display='';
  document.getElementById('doneWrap').classList.remove('show');
  launchSet();
}

function launchSet(){
  QI=0;
  qOrder=shuffle([...Array(SETS[SI].words.length).keys()]);
  buildDots();
  loadQ();
}

/* ══════════════════════════════════════════
   ❼ Q 도트
══════════════════════════════════════════ */
function buildDots(){
  const c=document.getElementById('qDots');c.innerHTML='';
  SETS[SI].words.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='qdot';d.id=`dot${i}`;
    c.appendChild(d);
  });
}
function refreshDots(){
  SETS[SI].words.forEach((_,i)=>{
    const d=document.getElementById(`dot${i}`);if(!d)return;
    d.className='qdot'+(i<QI?' done':i===QI?' cur':'');
  });
}

/* ══════════════════════════════════════════
   ❽ 문제 로드
══════════════════════════════════════════ */
function loadQ(){
  answered=false;selIdx=null;clickMap={};

  const set=SETS[SI];
  const ansWIdx=qOrder[QI];
  const ansW=set.words[ansWIdx];

  const badge=document.getElementById('setBadge');
  badge.textContent=`${set.name} · ${set.words.length}문제`;
  badge.className=`set-badge ${set.cls}`;

  const pct=Math.round(GI/TOTAL*100);
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pLabel').textContent=`${GI+1} / ${TOTAL}`;
  document.getElementById('pPct').textContent=pct+'%';

  refreshDots();

  /* 한국어 뜻 — 길이별 폰트 자동 조절 */
  const koEl=document.getElementById('koText');
  const raw=ansW.ko;
  koEl.innerHTML=raw.replace(/\n/g,'<br>');
  const len=raw.replace(/\n/g,'').length;
  koEl.className='ko-text'+(len>14?' sm':len>8?' md':'');

  renderCards(shuffle([...Array(set.words.length).keys()]));

  resetAnsBox();
  clrFB();
  document.getElementById('btnCheck').disabled=true;
  document.getElementById('btnNext').className='btn-next';
}

/* ══════════════════════════════════════════
   ❾ 카드 렌더링 (7개 → 4열 레이아웃)
══════════════════════════════════════════ */
function renderCards(cardOrder){
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML='';
  const n=cardOrder.length;

  /* 7개: 4열 → 첫 줄 4개, 둘째 줄 3개(가운데 정렬) */
  if(n===7){
    grid.className='cards-grid n7';
    grid.style.gridTemplateColumns='repeat(4,1fr)';
  } else if(n===6){
    grid.className='cards-grid';
    grid.style.gridTemplateColumns='repeat(3,1fr)';
  } else if(n===5){
    grid.className='cards-grid';
    grid.style.gridTemplateColumns='repeat(3,1fr)';
  } else {
    grid.className='cards-grid';
    grid.style.gridTemplateColumns='repeat(3,1fr)';
  }

  cardOrder.forEach((wIdx,slot)=>{
    const w=SETS[SI].words[wIdx];
    const btn=document.createElement('button');
    btn.className='wcard';
    btn.id=`wc${wIdx}`;
    btn.dataset.wIdx=wIdx;

    /* 7개일 때 둘째 줄 3개 가운데 배치 */
    if(n===7){
      if(slot===4) btn.style.cssText='grid-column:1/2;';
      if(slot===5) btn.style.cssText='grid-column:2/3;';
      if(slot===6) btn.style.cssText='grid-column:3/4;';
    }
    /* 5개일 때 마지막 줄 2개 좌우 배치 */
    if(n===5){
      if(slot===3) btn.style.cssText='grid-column:1/2;';
      if(slot===4) btn.style.cssText='grid-column:3/4;';
    }

    btn.innerHTML=
      `<span class="c-py">${w.py}</span>`+
      `<span class="c-hz">${w.hz}</span>`+
      `<span class="c-state" id="cs${wIdx}">🔊</span>`;

    btn.addEventListener('click',e=>{
      ripple(btn,e);
      onCard(btn,wIdx,w);
    });
    grid.appendChild(btn);
    clickMap[wIdx]=0;
  });
}

/* ══════════════════════════════════════════
   ❿ 카드 클릭 — 2단계 클릭 로직
   0→1 : 발음 재생 + 파란 하이라이트 + 👆
   1→2 : 정답창으로 이동 + ✓
   2→재클릭 : 선택 취소
══════════════════════════════════════════ */
function onCard(btn,wIdx,word){
  if(answered)return;

  const cnt=clickMap[wIdx]||0;

  if(selIdx!==null && selIdx!==wIdx) cancelSel();

  if(cnt===0){
    /* ★ 1번째 클릭 — 발음 재생 */
    document.querySelectorAll('.wcard.heard').forEach(c=>{
      const wi=parseInt(c.dataset.wIdx);
      c.classList.remove('heard');
      const cs=document.getElementById(`cs${wi}`);
      if(cs)cs.textContent='🔊';
      clickMap[wi]=0;
    });

    clickMap[wIdx]=1;
    btn.classList.add('heard');
    const csEl=document.getElementById(`cs${wIdx}`);
    if(csEl)csEl.textContent='👆';

    sfxClick();
    speak(word.tts);

  }else if(cnt===1){
    /* ★ 2번째 클릭 — 정답창으로 이동 */
    clickMap[wIdx]=2;
    selIdx=wIdx;

    btn.classList.remove('heard');
    btn.classList.add('sel');
    const csEl=document.getElementById(`cs${wIdx}`);
    if(csEl)csEl.textContent='✓';

    document.querySelectorAll('.wcard').forEach(c=>{
      if(parseInt(c.dataset.wIdx)!==wIdx) c.classList.add('dis');
    });

    sfxSelect();
    showAns(word);
    document.getElementById('btnCheck').disabled=false;
    clrFB();

  }else if(cnt===2){
    /* ★ 재클릭 — 선택 취소 */
    clickMap[wIdx]=0;
    cancelSel();
  }
}

function cancelSel(){
  document.querySelectorAll('.wcard').forEach(c=>{
    c.classList.remove('sel','dis','heard','ok-fl','ng-fl');
    const wi=parseInt(c.dataset.wIdx);
    const cs=document.getElementById(`cs${wi}`);
    if(cs)cs.textContent='🔊';
    clickMap[wi]=0;
  });
  selIdx=null;
  resetAnsBox();
  document.getElementById('btnCheck').disabled=true;
  clrFB();
}

/* ══════════════════════════════════════════
   ⓫ 정답창 표시 / 리셋
══════════════════════════════════════════ */
function showAns(w){
  document.getElementById('ansBox').classList.add('filled');
  document.getElementById('ansPH').style.display='none';
  const inner=document.getElementById('ansInner');
  inner.style.display='flex';
  inner.innerHTML=
    `<span class="a-py">${w.py}</span>`+
    `<span class="a-hz">${w.hz}</span>`+
    `<span class="ans-hint">🔊 다시 클릭하면 선택 취소</span>`;
}
function resetAnsBox(){
  document.getElementById('ansBox').classList.remove('filled');
  document.getElementById('ansPH').style.display='';
  const inner=document.getElementById('ansInner');
  inner.style.display='none';inner.innerHTML='';
}

/* ══════════════════════════════════════════
   ⓬ 피드백 헬퍼
══════════════════════════════════════════ */
function setFB(msg,cls){
  const el=document.getElementById('fb');
  el.textContent=msg;
  el.className='fb'+(cls?' '+cls:'');
}
function clrFB(){setFB('','');}

/* ══════════════════════════════════════════
   ⓭ 정답 확인
══════════════════════════════════════════ */
function checkAns(){
  if(selIdx===null||answered)return;
  answered=true;

  const ansWIdx=qOrder[QI];
  const isOK=(selIdx===ansWIdx);
  const all=[...document.querySelectorAll('.wcard')];

  if(isOK){
    correctCnt++;
    sfxOK();
    all.forEach(c=>{
      if(parseInt(c.dataset.wIdx)===ansWIdx) c.classList.add('ok-fl');
    });
    setFB('答对了！🎉 정답이에요!','ok');
    document.getElementById('btnCheck').disabled=true;
    document.getElementById('btnNext').className='btn-next on';

  }else{
    sfxNG();
    all.forEach(c=>{
      if(parseInt(c.dataset.wIdx)===selIdx) c.classList.add('ng-fl');
    });
    setFB('再试一次！😅 다시 도전해 보세요!','ng');

    setTimeout(()=>{
      answered=false;
      cancelSel();
    },1100);
  }
}

/* ══════════════════════════════════════════
   ⓮ 다음 문제
══════════════════════════════════════════ */
function nextQ(){
  QI++;GI++;
  if(QI>=SETS[SI].words.length){
    SI++;
    if(SI>=SETS.length){showDone();return;}
    launchSet();
  }else{
    loadQ();
  }
}

/* ══════════════════════════════════════════
   ⓯ 완료 화면
══════════════════════════════════════════ */
function showDone(){
  document.getElementById('pFill').style.width='100%';
  document.getElementById('pLabel').textContent=`${TOTAL} / ${TOTAL}`;
  document.getElementById('pPct').textContent='100%';
  document.getElementById('gameBox').style.display='none';
  const dw=document.getElementById('doneWrap');
  dw.classList.add('show');
  document.getElementById('scoreNum').textContent=`${correctCnt} / ${TOTAL}`;
  sfxDone();
}

/* ══════════════════════════════════════════
   ⓰ 시작!
══════════════════════════════════════════ */
window.addEventListener('load',startGame);
</script>
