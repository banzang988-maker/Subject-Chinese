<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중국어 회화 학습</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .lesson-group {
            margin-bottom: 20px;
        }
        .lesson-title {
            font-size: 15px;
            font-weight: 600;
            color: #4a5568;
            text-align: left;
            margin-bottom: 8px;
            padding-left: 5px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            background-color: #4a90e2;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.2);
        }
        .btn:hover, .btn:active {
            background-color: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🇨🇳 중국어 회화 학습</h1>
        <p class="subtitle">학습할 과와 회화를 선택해 주세요</p>

        <!-- 1과 -->
        <div class="lesson-group">
            <div class="lesson-title">📌 1과</div>
            <div class="btn-grid">
                <a href="1과 회화-01.html" class="btn">1과 회화-01</a>
                <a href="1과 회화-02.html" class="btn">1과 회화-02</a>
            </div>
        </div>

        <!-- 2과 -->
        <div class="lesson-group">
            <div class="lesson-title">📌 2과</div>
            <div class="btn-grid">
                <a href="2과 회화-01.html" class="btn">2과 회화-01</a>
                <a href="2과 회화-02.html" class="btn">2과 회화-02</a>
            </div>
        </div>

        <!-- 3과 -->
        <div class="lesson-group">
            <div class="lesson-title">📌 3과</div>
            <div class="btn-grid">
                <a href="3과 회화-01.html" class="btn">3과 회화-01</a>
                <a href="3과 회화-02.html" class="btn">3과 회화-02</a>
            </div>
        </div>

        <!-- 4과 -->
        <div class="lesson-group">
            <div class="lesson-title">📌 4과</div>
            <div class="btn-grid">
                <a href="4과 회화-01.html" class="btn">4과 회화-01</a>
                <a href="4과 회화-02.html" class="btn">4과 회화-02</a>
            </div>
        </div>
    </div>

</body>
</html>
